<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Iconos propuesta</title>
<style>
body{margin:0;background:#0b1012;font:600 14px Inter,Arial,sans-serif;color:#e8f1ef;padding:28px;width:1180px}
h1{font-size:18px;margin:0 0 18px;letter-spacing:.08em}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.c{display:flex;flex-direction:column;align-items:center;gap:10px}
.c svg{width:340px;height:340px;border-radius:76px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.c b{font-size:15px;letter-spacing:.06em}.c span{color:#93a8a6;font-weight:500;font-size:12.5px;text-align:center;max-width:330px}
</style></head><body>
<h1>CARTERA CARLOS · VELAS · MÁS COLOR</h1>
<div class="g" id="g"></div>
<script>
// Marco angular abierto, como el del icono de la Zontes: un trazo de acento grueso que se afina y otro oscuro.
const frame = (acc, dk, w = 1) => `
  <path d="M28 226 L150 84 L372 80 L348 92 L160 96 L44 232Z" fill="${acc}"/>
  <path d="M372 80 L478 186 L462 188 L360 94Z" fill="${dk}"/>
  <path d="M30 250 L26 392 L116 470 L350 438 L116 458 L40 388Z" fill="${dk}"/>
  <path d="M478 300 L470 420 L420 462 L430 440 L462 410Z" fill="${acc}" opacity=".9"/>`;



const grad = (id, c1, c2) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
const C = (x, top, h, wt, wb, fill, wick, w = 56, extra = '') => `<line x1="${x+w/2}" y1="${wt}" x2="${x+w/2}" y2="${wb}" stroke="${wick}" stroke-width="12" stroke-linecap="round"/><rect x="${x}" y="${top}" width="${w}" height="${h}" rx="${w*0.26}" fill="${fill}" ${extra}/>`;
const G = '#43E8C0', R = '#ff6b6b', Y = '#FFD36E';
const icons = [
 { n: 'E1 · CINCO VELAS EN GRADIENTE', d: 'Cinco velas con degradado verde/rojo y la última en oro, sobre fondo con brillo.',
   svg: `<defs>${grad('g1','#7bf5d7','#1bb894')}${grad('r1','#ff9a9a','#e0454d')}${grad('y1','#ffe49a','#f0b429')}<radialGradient id="bg1" cx=".5" cy=".15" r=".9"><stop offset="0" stop-color="#1c3b38"/><stop offset="1" stop-color="#0A1214"/></radialGradient></defs>
   <rect width="512" height="512" fill="url(#bg1)"/>
   ${C(48,230,90,190,360,'url(#r1)',R,50)}${C(138,290,80,250,400,'url(#g1)',G,50)}${C(228,200,110,150,350,'url(#r1)',R,50)}${C(318,160,120,110,320,'url(#g1)',G,50)}${C(408,70,150,40,260,'url(#y1)',Y,50)}` },
 { n: 'E2 · NEÓN', d: 'Velas con halo luminoso sobre violeta oscuro: verde, rojo, cian y oro.',
   svg: `<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter><radialGradient id="bg2" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#2a1b52"/><stop offset="1" stop-color="#0d0a1f"/></radialGradient></defs>
   <rect width="512" height="512" fill="url(#bg2)"/>
   <g filter="url(#gl)" opacity=".85">${C(70,290,80,250,400,'#ff4d8d','#ff4d8d')}${C(170,220,110,170,370,'#43E8C0','#43E8C0')}${C(270,260,70,220,380,'#7ad9f5','#7ad9f5')}${C(370,110,150,70,300,'#FFD36E','#FFD36E')}</g>
   ${C(70,290,80,250,400,'#ff4d8d','#ff86b3')}${C(170,220,110,170,370,'#43E8C0','#9ff7e3')}${C(270,260,70,220,380,'#7ad9f5','#c1eefb')}${C(370,110,150,70,300,'#FFD36E','#fff0c2')}` },
 { n: 'E3 · PASTILLAS', d: 'Velas muy redondeadas tipo pastilla, colores vivos y fondo en degradado diagonal.',
   svg: `<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#143c5a"/><stop offset="1" stop-color="#0b1d2f"/></linearGradient></defs>
   <rect width="512" height="512" fill="url(#bg3)"/>
   <rect x="64" y="250" width="62" height="150" rx="31" fill="#ff6b6b"/><rect x="160" y="170" width="62" height="190" rx="31" fill="#43E8C0"/>
   <rect x="256" y="230" width="62" height="130" rx="31" fill="#7ad9f5"/><rect x="352" y="96" width="62" height="220" rx="31" fill="#FFD36E"/>
   <circle cx="383" cy="396" r="9" fill="#FFD36E"/><circle cx="191" cy="420" r="9" fill="#43E8C0"/>` },
 { n: 'E4 · HUECAS Y LLENAS', d: 'Mezcla de velas huecas (solo borde) y llenas, como en los gráficos profesionales.',
   svg: `<rect width="512" height="512" fill="#0F1A1C"/>
   ${C(60,270,90,230,400,'none',R,60,'stroke="#ff6b6b" stroke-width="12"')}${C(158,200,110,150,370,G,G,60)}${C(256,250,80,200,380,'none',G,60,'stroke="#43E8C0" stroke-width="12"')}${C(354,100,150,60,330,Y,Y,60)}
   <line x1="40" y1="430" x2="472" y2="430" stroke="#283a3c" stroke-width="8" stroke-linecap="round"/>` },
 { n: 'E5 · EN ARCO CON MONEDA', d: 'Velas siguiendo un arco ascendente y una moneda de oro coronando la última.',
   svg: `<defs>${grad('g5','#7bf5d7','#1bb894')}${grad('r5','#ff9a9a','#e0454d')}</defs><rect width="512" height="512" fill="#10242b"/>
   ${C(52,330,60,300,420,'url(#r5)',R,52)}${C(142,290,70,250,400,'url(#g5)',G,52)}${C(232,230,80,190,370,'url(#g5)',G,52)}${C(322,170,90,130,330,'url(#g5)',G,52)}
   <line x1="444" y1="120" x2="444" y2="300" stroke="${Y}" stroke-width="12" stroke-linecap="round"/><rect x="418" y="170" width="52" height="100" rx="14" fill="url(#g5)"/>
   <circle cx="444" cy="92" r="40" fill="${Y}"/><circle cx="444" cy="92" r="28" fill="none" stroke="#b9902f" stroke-width="7"/>
   <text x="444" y="106" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="38" fill="#b9902f">€</text>` },
 { n: 'E6 · ARCO IRIS BURSÁTIL', d: 'Seis velas pequeñas con colores distintos subiendo: más alegre y reconocible.',
   svg: `<defs><linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a3a"/><stop offset="1" stop-color="#0b1020"/></linearGradient></defs>
   <rect width="512" height="512" fill="url(#bg6)"/>
   ${[['#ff6b6b',330,70,300,430],['#ffa64d',290,80,250,410],['#FFD36E',250,80,210,380],['#43E8C0',200,90,160,350],['#7ad9f5',150,100,110,320],['#b9a4e0',90,120,50,290]].map(([c,t,h,wt,wb],i)=>C(34+i*74,t,h,wt,wb,c,c,48)).join('')}` },
];
document.getElementById('g').innerHTML = icons.map(i => `<div class="c"><svg viewBox="0 0 512 512">${i.svg}</svg><b>${i.n}</b><span>${i.d}</span></div>`).join('');
</script></body></html>
